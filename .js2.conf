# Project overrides for the `js2` Jetstream2 helper, sourced from the repo root.
# Account defaults live in ~/.jetstream2/js2.conf.
#
# EXP_LOCAL defaults to the git root, which is what we want, so it is left unset.
# EXP_REMOTE would default to /workspace/mcp-position-bias from the local directory
# name; pin the spelling instead so paths in docs and logs match.
#
# The instance `mcq-team` is shared by the team: never launch another instance, and
# never kill/finish it or delete mcq-team-vol without asking first.
EXP_REMOTE=/workspace/mcq-position-bias
